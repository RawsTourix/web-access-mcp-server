# Runtime profile for the private, Compose-only SearXNG provider.
# The secret key is deliberately absent and must arrive through SEARXNG_SECRET.
use_default_settings: true

general:
  instance_name: "Web Access private Search"
  debug: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
